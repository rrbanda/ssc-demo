apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-select-cve
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, security, remediation"
spec:
  description: >-
    Ask the AI agent to choose exactly ONE dependency vulnerability to
    remediate from the must-fix set. Calls the lw-agents ADK service via
    its external Route over SSE streaming.
  params:
    - name: VULNERABILITY_REPORT_PATH
      type: string
      description: Absolute path (on the workspace) to the RHTPA vulnerability-analysis JSON.
      default: ""
    - name: REMEDIATION_REPORT_PATH
      type: string
      description: Absolute path (on the workspace) to the RHTPA remediation JSON.
      default: ""
    - name: MUST_FIX_PATH
      type: string
      description: Absolute path (on the workspace) to the Conforma must-fix JSON array.
      default: ""
    - name: POLICY_CONTEXT
      type: string
      description: User-defined prioritization policy (natural language).
      default: >-
        Prefer CRITICAL/HIGH severity CVEs that have a vendor-recommended fixed
        version. Avoid major-version bumps unless required to obtain the fix.
        Never select a CVE without a concrete fixed version. Prefer changes that
        touch a single dependency.
    - name: AGENT_ENDPOINT
      type: string
      description: External URL of the lw-agents ADK service.
      default: https://lw-agents-tssc-agents.apps.ocp.qn6c5.sandbox1388.opentlc.com
  workspaces:
    - name: workspace
  results:
    - name: SELECTED
      description: "1 if a CVE was selected, 0 if none qualified."
    - name: CVE_ID
    - name: PACKAGE
      description: Maven coordinates (groupId:artifactId) of the dependency to bump.
    - name: CURRENT_VERSION
    - name: FIXED_VERSION
    - name: JUSTIFICATION
  steps:
    - name: call-agent
      image: registry.access.redhat.com/ubi9/ubi:latest
      env:
        - name: AGENT_ENDPOINT
          value: $(params.AGENT_ENDPOINT)
        - name: WORKSPACE_PATH
          value: $(workspaces.workspace.path)
        - name: VULN_REPORT
          value: $(params.VULNERABILITY_REPORT_PATH)
        - name: MUST_FIX
          value: $(params.MUST_FIX_PATH)
        - name: POLICY
          value: $(params.POLICY_CONTEXT)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "Calling lw-agents CVE selection: ${AGENT_ENDPOINT}"

        # Fail-safe defaults
        printf '0' > "$(results.SELECTED.path)"
        for r in CVE_ID PACKAGE CURRENT_VERSION FIXED_VERSION JUSTIFICATION; do
          printf '' > "$(results.${r}.path)"
        done

        # 1. Create session
        SESSION_ID=$(curl -sf -X POST "${AGENT_ENDPOINT}/apps/app/users/tekton/sessions" \
          -H "Content-Type: application/json" -d '{}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])") || {
            echo "ERROR: Failed to create session" >&2; exit 1
          }
        echo "Session: ${SESSION_ID}"

        # 2. Build prompt
        PROMPT="Select the best CVE to remediate.
        Workspace path: ${WORKSPACE_PATH}
        Vulnerability report: ${VULN_REPORT:-${WORKSPACE_PATH}/rhtpa/vulnerabilities.json}
        Must-fix CVEs: ${MUST_FIX:-${WORKSPACE_PATH}/rhtpa/must-fix-cves.json}
        Policy: ${POLICY}"

        PROMPT_JSON=$(printf '%s' "${PROMPT}" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')

        # 3. Call agent via SSE
        curl -sf -X POST "${AGENT_ENDPOINT}/run_sse" \
          -H "Content-Type: application/json" \
          -d "{\"app_name\":\"app\",\"user_id\":\"tekton\",\"session_id\":\"${SESSION_ID}\",\"new_message\":{\"role\":\"user\",\"parts\":[{\"text\":${PROMPT_JSON}}]}}" \
          --max-time 600 > /tmp/sse_response.txt || {
            echo "ERROR: Agent call failed" >&2; exit 1
          }

        # 4. Parse structured_result from SSE stream and write Tekton results
        python3 -c "
        import json
        raw = open('/tmp/sse_response.txt').read()
        result = {}
        for line in raw.splitlines():
            if line.startswith('data: '):
                try:
                    evt = json.loads(line[6:])
                    sr = (evt.get('stateDelta') or {}).get('structured_result')
                    if sr and isinstance(sr, dict):
                        result = sr
                except: pass
        for key, path in [
            ('SELECTED', '$(results.SELECTED.path)'),
            ('CVE_ID', '$(results.CVE_ID.path)'),
            ('PACKAGE', '$(results.PACKAGE.path)'),
            ('CURRENT_VERSION', '$(results.CURRENT_VERSION.path)'),
            ('FIXED_VERSION', '$(results.FIXED_VERSION.path)'),
            ('JUSTIFICATION', '$(results.JUSTIFICATION.path)'),
        ]:
            open(path, 'w').write(str(result.get(key, '' if key != 'SELECTED' else '0')))
        print(json.dumps(result, indent=2))
        "
        echo "CVE selection complete."
