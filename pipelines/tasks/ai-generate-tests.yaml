apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-generate-tests
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, testing, maven"
spec:
  description: >-
    Use the AI agent to generate JUnit unit tests for the application.
    Calls the lw-agents ADK service via its external Route over SSE streaming.
  params:
    - name: SUBDIRECTORY
      type: string
      description: Project subdirectory within the source workspace.
      default: source
    - name: AGENT_IMAGE
      type: string
      description: Kept for backward compatibility; unused by the agent service.
      default: unused
    - name: TEST_INSTRUCTIONS
      type: string
      description: Extra natural-language guidance for the test-generation agent.
      default: >-
        Prioritize public service and business-logic classes that currently lack
        coverage. Keep tests deterministic and offline (no network, no live DB).
    - name: SOURCE_PATHS
      type: string
      description: Space-separated main-source paths (kept for compatibility).
      default: src/main/java
    - name: AGENT_ENDPOINT
      type: string
      description: External URL of the lw-agents ADK service.
      default: https://lw-agents-tssc-agents.apps.ocp.qn6c5.sandbox1388.opentlc.com
  workspaces:
    - name: source
      description: Workspace containing the application source (shared PVC).
  results:
    - name: TESTS_ADDED
      description: Number of new/changed test files staged by the agent.
  steps:
    - name: call-agent
      image: registry.access.redhat.com/ubi9/ubi:latest
      env:
        - name: AGENT_ENDPOINT
          value: $(params.AGENT_ENDPOINT)
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)/$(params.SUBDIRECTORY)
        - name: TEST_INSTRUCTIONS
          value: $(params.TEST_INSTRUCTIONS)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "Calling lw-agents test generation: ${AGENT_ENDPOINT}"

        # Fail-safe default
        printf '0' > "$(results.TESTS_ADDED.path)"

        # 1. Create session
        SESSION_ID=$(curl -sf -X POST "${AGENT_ENDPOINT}/apps/app/users/tekton/sessions" \
          -H "Content-Type: application/json" -d '{}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])") || {
            echo "ERROR: Failed to create session" >&2; exit 1
          }

        # 2. Build prompt
        PROMPT="Generate unit tests for the project.
        Workspace path: ${WORKSPACE_PATH}
        Instructions: ${TEST_INSTRUCTIONS}"

        PROMPT_JSON=$(printf '%s' "${PROMPT}" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')

        # 3. Call agent via SSE
        curl -sf -X POST "${AGENT_ENDPOINT}/run_sse" \
          -H "Content-Type: application/json" \
          -d "{\"app_name\":\"app\",\"user_id\":\"tekton\",\"session_id\":\"${SESSION_ID}\",\"new_message\":{\"role\":\"user\",\"parts\":[{\"text\":${PROMPT_JSON}}]}}" \
          --max-time 600 > /tmp/sse_response.txt || {
            echo "ERROR: Agent call failed" >&2; exit 1
          }

        # 4. Parse structured_result
        python3 -c "
        import json
        raw = open('/tmp/sse_response.txt').read()
        result = {}
        for line in raw.splitlines():
            if line.startswith('data: '):
                try:
                    evt = json.loads(line[6:])
                    sr = (evt.get('stateDelta') or {}).get('structured_result')
                    if sr and isinstance(sr, dict):
                        result = sr
                except: pass
        tests = str(result.get('TESTS_ADDED', '0'))
        open('$(results.TESTS_ADDED.path)', 'w').write(tests)
        print(json.dumps(result, indent=2))
        "
        echo "Test generation complete."
