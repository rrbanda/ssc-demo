apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-generate-tests
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, testing, maven"
spec:
  description: >-
    Use the AI agent to generate JUnit unit tests.
    Agent clones the repo, generates tests, and pushes a branch.
  params:
    - name: SUBDIRECTORY
      type: string
      default: source
    - name: AGENT_IMAGE
      type: string
      default: unused
    - name: TEST_INSTRUCTIONS
      type: string
      default: >-
        Prioritize public service and business-logic classes that currently lack
        coverage. Keep tests deterministic and offline.
    - name: SOURCE_PATHS
      type: string
      default: src/main/java
    - name: GIT_URL
      type: string
      default: ""
    - name: GIT_HOST
      type: string
      default: ""
    - name: SCM_PROVIDER
      type: string
      default: gitlab
    - name: BASE_BRANCH
      type: string
      default: main
    - name: AGENT_ENDPOINT
      type: string
      default: https://lw-agents-tssc-agents.apps.ocp.qn6c5.sandbox1388.opentlc.com
  workspaces:
    - name: source
  results:
    - name: TESTS_ADDED
      description: Number of new/changed test files.
  steps:
    - name: call-agent
      image: registry.access.redhat.com/ubi9/ubi:latest
      env:
        - name: AGENT_ENDPOINT
          value: $(params.AGENT_ENDPOINT)
        - name: TEST_INSTRUCTIONS
          value: $(params.TEST_INSTRUCTIONS)
        - name: GIT_URL
          value: $(params.GIT_URL)
        - name: GIT_HOST
          value: $(params.GIT_HOST)
        - name: SCM_PROVIDER
          value: $(params.SCM_PROVIDER)
        - name: BASE_BRANCH
          value: $(params.BASE_BRANCH)
        - name: RESULT_TESTS_ADDED
          value: $(results.TESTS_ADDED.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== ai-generate-tests: calling lw-agents ==="

        printf '0' > "${RESULT_TESTS_ADDED}"

        # Create session
        export SESSION_ID=$(curl -sk -X POST "${AGENT_ENDPOINT}/apps/app/users/tekton/sessions" \
          -H "Content-Type: application/json" -d '{}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])") || {
            echo "ERROR: session creation failed" >&2; exit 1; }

        # Build request (quoted heredoc)
        python3 << 'PYEOF' > /tmp/request.json
        import json, os
        prompt = (
            f"Generate JUnit tests for the project. "
            f"Repository URL: {os.environ['GIT_URL']}. "
            f"Git host: {os.environ['GIT_HOST']}. "
            f"SCM provider: {os.environ['SCM_PROVIDER']}. "
            f"Base branch: {os.environ['BASE_BRANCH']}. "
            f"Instructions: {os.environ['TEST_INSTRUCTIONS']}."
        )
        req = {
            "app_name": "app",
            "user_id": "tekton",
            "session_id": os.environ["SESSION_ID"],
            "new_message": {"role": "user", "parts": [{"text": prompt}]}
        }
        print(json.dumps(req))
        PYEOF

        # Call agent
        curl -sk -X POST "${AGENT_ENDPOINT}/run_sse" \
          -H "Content-Type: application/json" \
          -d @/tmp/request.json \
          --max-time 600 > /tmp/sse_response.txt || {
            echo "ERROR: agent call failed" >&2; exit 1; }

        # Parse (quoted heredoc)
        python3 << 'PYEOF'
        import json, os
        raw = open("/tmp/sse_response.txt").read()
        result = {}
        for line in raw.splitlines():
            if not line.startswith("data:"): continue
            try:
                d = json.loads(line[5:].strip())
                sr = d.get("actions",{}).get("stateDelta",{}).get("structured_result")
                if not sr:
                    sr = (d.get("stateDelta") or {}).get("structured_result")
                if sr and isinstance(sr, dict):
                    result = sr
            except: pass
        open(os.environ["RESULT_TESTS_ADDED"], "w").write(str(result.get("TESTS_ADDED", "0")))
        print(json.dumps(result, indent=2))
        PYEOF

        echo "=== ai-generate-tests complete ==="
