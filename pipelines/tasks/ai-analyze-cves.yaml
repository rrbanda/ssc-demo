apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-analyze-cves
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, security, remediation"
spec:
  description: >-
    Ask the AI agent to analyze EVERY fixable CVE in the must-fix set and
    create one SCM issue per vulnerability. Calls the lw-agents ADK service
    via its external Route over SSE streaming.
  params:
    - name: VULNERABILITY_REPORT_PATH
      type: string
      default: ""
    - name: REMEDIATION_REPORT_PATH
      type: string
      default: ""
    - name: MUST_FIX_PATH
      type: string
      default: ""
    - name: POLICY_CONTEXT
      type: string
      default: >-
        Prefer CRITICAL/HIGH severity CVEs that have a vendor-recommended fixed
        version. Avoid major-version bumps unless required to obtain the fix.
        Never propose a CVE without a concrete fixed version. Prefer changes that
        touch a single dependency.
    - name: AI_PYTHON_IMAGE
      type: string
      description: Kept for backward compatibility; unused by the agent service.
      default: unused
    - name: BATCH_SIZE
      type: string
      default: "12"
    - name: MAX_TOKENS
      type: string
      default: "8000"
    - name: AGENT_ENDPOINT
      type: string
      description: External URL of the lw-agents ADK service.
      default: https://lw-agents-tssc-agents.apps.ocp.qn6c5.sandbox1388.opentlc.com
  workspaces:
    - name: workspace
  results:
    - name: COUNT
      description: Number of fixable vulnerabilities.
    - name: DECISIONS_PATH
      description: Path to decisions JSON (empty — agent handles issues directly).
    - name: ISSUES_DIR
      description: Path to issues dir (empty — agent handles issues directly).
  steps:
    - name: call-agent
      image: registry.access.redhat.com/ubi9/ubi:latest
      env:
        - name: AGENT_ENDPOINT
          value: $(params.AGENT_ENDPOINT)
        - name: WORKSPACE_PATH
          value: $(workspaces.workspace.path)
        - name: VULN_REPORT
          value: $(params.VULNERABILITY_REPORT_PATH)
        - name: MUST_FIX
          value: $(params.MUST_FIX_PATH)
        - name: POLICY
          value: $(params.POLICY_CONTEXT)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "Calling lw-agents CVE analysis: ${AGENT_ENDPOINT}"

        # Fail-safe defaults
        printf '0' > "$(results.COUNT.path)"
        printf '' > "$(results.DECISIONS_PATH.path)"
        printf '' > "$(results.ISSUES_DIR.path)"

        # 1. Create session
        SESSION_ID=$(curl -sf -X POST "${AGENT_ENDPOINT}/apps/app/users/tekton/sessions" \
          -H "Content-Type: application/json" -d '{}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])") || {
            echo "ERROR: Failed to create session" >&2; exit 1
          }

        # 2. Build prompt
        PROMPT="Analyze all CVEs and create issues for fixable ones.
        Workspace path: ${WORKSPACE_PATH}
        Vulnerability report: ${VULN_REPORT:-${WORKSPACE_PATH}/rhtpa/vulnerabilities.json}
        Must-fix CVEs: ${MUST_FIX:-${WORKSPACE_PATH}/rhtpa/must-fix-cves.json}
        Policy: ${POLICY}"

        PROMPT_JSON=$(printf '%s' "${PROMPT}" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')

        # 3. Call agent via SSE
        curl -sf -X POST "${AGENT_ENDPOINT}/run_sse" \
          -H "Content-Type: application/json" \
          -d "{\"app_name\":\"app\",\"user_id\":\"tekton\",\"session_id\":\"${SESSION_ID}\",\"new_message\":{\"role\":\"user\",\"parts\":[{\"text\":${PROMPT_JSON}}]}}" \
          --max-time 600 > /tmp/sse_response.txt || {
            echo "ERROR: Agent call failed" >&2; exit 1
          }

        # 4. Parse structured_result
        python3 -c "
        import json
        raw = open('/tmp/sse_response.txt').read()
        result = {}
        for line in raw.splitlines():
            if line.startswith('data: '):
                try:
                    evt = json.loads(line[6:])
                    sr = (evt.get('stateDelta') or {}).get('structured_result')
                    if sr and isinstance(sr, dict):
                        result = sr
                except: pass
        open('$(results.COUNT.path)', 'w').write(str(result.get('COUNT', '0')))
        open('$(results.DECISIONS_PATH.path)', 'w').write(str(result.get('DECISIONS_PATH', '')))
        open('$(results.ISSUES_DIR.path)', 'w').write(str(result.get('ISSUES_DIR', '')))
        print(json.dumps(result, indent=2))
        "
        echo "CVE analysis complete."
