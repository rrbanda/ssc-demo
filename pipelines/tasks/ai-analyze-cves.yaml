apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-analyze-cves
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, security, remediation"
spec:
  description: >-
    Ask the AI agent to analyze EVERY fixable CVE. Reads workspace files,
    sends CONTENT to the agent, writes .title/.body/.labels files back.
  params:
    - name: VULNERABILITY_REPORT_PATH
      type: string
      default: ""
    - name: REMEDIATION_REPORT_PATH
      type: string
      default: ""
    - name: MUST_FIX_PATH
      type: string
      default: ""
    - name: POLICY_CONTEXT
      type: string
      default: >-
        Prefer CRITICAL/HIGH severity CVEs that have a vendor-recommended fixed
        version. Avoid major-version bumps unless required to obtain the fix.
    - name: AI_PYTHON_IMAGE
      type: string
      default: unused
    - name: BATCH_SIZE
      type: string
      default: "12"
    - name: MAX_TOKENS
      type: string
      default: "8000"
    - name: AGENT_ENDPOINT
      type: string
      default: https://lw-agents-tssc-agents.apps.ocp.qn6c5.sandbox1388.opentlc.com
  workspaces:
    - name: workspace
  results:
    - name: COUNT
      description: Number of fixable vulnerabilities.
    - name: DECISIONS_PATH
    - name: ISSUES_DIR
  steps:
    - name: call-agent
      image: registry.access.redhat.com/ubi9/ubi:latest
      env:
        - name: AGENT_ENDPOINT
          value: $(params.AGENT_ENDPOINT)
        - name: WORKSPACE_PATH
          value: $(workspaces.workspace.path)
        - name: VULN_REPORT_PATH
          value: $(params.VULNERABILITY_REPORT_PATH)
        - name: MUST_FIX_PATH
          value: $(params.MUST_FIX_PATH)
        - name: POLICY
          value: $(params.POLICY_CONTEXT)
        - name: RESULT_COUNT
          value: $(results.COUNT.path)
        - name: RESULT_DECISIONS_PATH
          value: $(results.DECISIONS_PATH.path)
        - name: RESULT_ISSUES_DIR
          value: $(results.ISSUES_DIR.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== ai-analyze-cves: calling lw-agents ==="

        # Setup output dirs
        OUTDIR="${WORKSPACE_PATH}/analysis"
        ISSUES_DIR="${OUTDIR}/issues"
        mkdir -p "${ISSUES_DIR}"

        # Fail-safe defaults
        printf '0' > "${RESULT_COUNT}"
        printf '%s' "${OUTDIR}/decisions.json" > "${RESULT_DECISIONS_PATH}"
        printf '%s' "${ISSUES_DIR}" > "${RESULT_ISSUES_DIR}"

        # Resolve files
        export MF_FILE="${MUST_FIX_PATH:-${WORKSPACE_PATH}/rhtpa/must-fix-cves.json}"
        export VR_FILE="${VULN_REPORT_PATH:-${WORKSPACE_PATH}/rhtpa/vulnerabilities.json}"

        CVE_COUNT=$(python3 -c "import json; print(len(json.load(open('${MF_FILE}'))))" 2>/dev/null || echo "0")
        echo "Must-fix CVEs: ${CVE_COUNT}"

        if [ "${CVE_COUNT}" = "0" ]; then
          echo "No must-fix CVEs. Done."
          echo '[]' > "${OUTDIR}/decisions.json"
          exit 0
        fi

        # Create session
        export SESSION_ID=$(curl -sk -X POST "${AGENT_ENDPOINT}/apps/app/users/tekton/sessions" \
          -H "Content-Type: application/json" -d '{}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])") || {
            echo "ERROR: session creation failed" >&2; exit 1; }

        # Build request (quoted heredoc)
        python3 << 'PYEOF' > /tmp/request.json
        import json, os

        must_fix = open(os.environ["MF_FILE"]).read()
        vuln = open(os.environ["VR_FILE"]).read()[:100000]
        policy = os.environ.get("POLICY", "")
        session_id = os.environ["SESSION_ID"]

        prompt = (
            "Analyze all CVEs in the must-fix set below. For each fixable CVE, "
            "determine the recommended fixed version and produce a remediation decision.\n\n"
            "MUST-FIX CVEs:\n" + must_fix + "\n\n"
            "VULNERABILITY REPORT:\n" + vuln + "\n\n"
            "POLICY: " + policy + "\n\n"
            "For each fixable CVE, report: cve_id, package, current_version, fixed_version, "
            "severity, justification. Set selected=true only when you can supply a concrete "
            "fixed version."
        )

        req = {
            "app_name": "app",
            "user_id": "tekton",
            "session_id": session_id,
            "new_message": {"role": "user", "parts": [{"text": prompt}]}
        }
        print(json.dumps(req))
        PYEOF

        # Call agent
        curl -sk -X POST "${AGENT_ENDPOINT}/run_sse" \
          -H "Content-Type: application/json" \
          -d @/tmp/request.json \
          --max-time 600 > /tmp/sse_response.txt || {
            echo "ERROR: agent call failed" >&2; exit 1; }

        # Parse response and write issue files (quoted heredoc)
        export ISSUES_DIR OUTDIR
        python3 << 'PYEOF'
        import json, os, re

        issues_dir = os.environ["ISSUES_DIR"]
        outdir = os.environ["OUTDIR"]
        decisions_path = os.path.join(outdir, "decisions.json")

        raw = open("/tmp/sse_response.txt").read()
        result = {}
        agent_text = ""
        for line in raw.splitlines():
            if not line.startswith("data:"): continue
            try:
                d = json.loads(line[5:].strip())
                sr = d.get("actions",{}).get("stateDelta",{}).get("structured_result")
                if not sr:
                    sr = (d.get("stateDelta") or {}).get("structured_result")
                if sr and isinstance(sr, dict):
                    result = sr
                content = d.get("content", {})
                if isinstance(content, dict):
                    for part in content.get("parts", []):
                        if isinstance(part, dict) and "text" in part:
                            agent_text += part["text"]
            except: pass

        # Try to get decisions from structured_result first
        decisions = result.get("DECISIONS", [])

        # Fallback: extract JSON array from agent text
        if not decisions and agent_text:
            for m in re.finditer(r'\[[\s\S]*?\]', agent_text):
                try:
                    arr = json.loads(m.group(0))
                    if isinstance(arr, list) and arr and isinstance(arr[0], dict):
                        decisions = [d for d in arr if isinstance(d, dict) and d.get("selected")]
                        if decisions: break
                except: pass

        # Write issue files
        count = 0
        for dec in decisions:
            cve = str(dec.get("cve_id", ""))
            if not cve: continue
            safe = re.sub(r"[^A-Za-z0-9._-]", "_", cve)
            pkg = dec.get("package", "")
            cur = dec.get("current_version", "")
            fix = dec.get("fixed_version", "")
            sev = dec.get("severity", "")
            just = dec.get("justification", "")

            title = f"Remediate {cve}: {pkg} {cur} -> {fix}"
            marker = "\n".join(f'{k}: {json.dumps(v)}' for k, v in [
                ("SELECTED", "1"), ("CVE_ID", cve), ("PACKAGE", pkg),
                ("CURRENT_VERSION", cur), ("FIXED_VERSION", fix),
                ("JUSTIFICATION", just)])
            body = (
                f"## Vulnerability remediation: {cve}\n\n"
                f"{just}\n\n"
                f"| Field | Value |\n|---|---|\n"
                + (f"| Severity | `{sev}` |\n" if sev else "")
                + f"| Package | `{pkg}` |\n"
                + f"| Current version | `{cur}` |\n"
                + f"| Recommended version | `{fix}` |\n\n"
                + "To remediate, comment `/remediate` on this issue.\n\n"
                + f"<!-- cve-decision\n{marker}\n-->\n"
            )
            open(os.path.join(issues_dir, f"{safe}.title"), "w").write(title)
            open(os.path.join(issues_dir, f"{safe}.body"), "w").write(body)
            open(os.path.join(issues_dir, f"{safe}.labels"), "w").write(sev)
            count += 1

        json.dump(decisions, open(decisions_path, "w"), indent=2)
        open(os.environ["RESULT_COUNT"], "w").write(str(count))
        print(f"Wrote {count} issue files")
        PYEOF

        echo "=== ai-analyze-cves complete ==="
