apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-remediate-dependency
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, security, remediation, maven"
spec:
  description: >-
    Use the AI agent to update the vulnerable Maven dependency.
    Sends CVE details and git repo URL to the lw-agents service which
    clones the repo, applies the fix via OpenCode, and pushes a branch.
  params:
    - name: SUBDIRECTORY
      type: string
      default: source
    - name: CVE_ID
      type: string
    - name: PACKAGE
      type: string
      description: Maven coordinates (groupId:artifactId) to update.
    - name: CURRENT_VERSION
      type: string
      default: ""
    - name: FIXED_VERSION
      type: string
    - name: JUSTIFICATION
      type: string
      default: ""
    - name: GIT_URL
      type: string
      description: HTTPS URL of the application repository.
      default: ""
    - name: GIT_HOST
      type: string
      description: SCM host for the PR.
      default: ""
    - name: SCM_PROVIDER
      type: string
      default: gitlab
    - name: BASE_BRANCH
      type: string
      default: main
    - name: AGENT_IMAGE
      type: string
      description: Kept for backward compatibility; unused.
      default: unused
    - name: AGENT_ENDPOINT
      type: string
      default: https://lw-agents-tssc-agents.apps.ocp.qn6c5.sandbox1388.opentlc.com
  workspaces:
    - name: source
  results:
    - name: CHANGED
      description: "1 if the agent modified the build files, else 0."
  steps:
    - name: call-agent
      image: registry.access.redhat.com/ubi9/ubi:latest
      env:
        - name: AGENT_ENDPOINT
          value: $(params.AGENT_ENDPOINT)
        - name: CVE_ID
          value: $(params.CVE_ID)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: CURRENT_VERSION
          value: $(params.CURRENT_VERSION)
        - name: FIXED_VERSION
          value: $(params.FIXED_VERSION)
        - name: JUSTIFICATION
          value: $(params.JUSTIFICATION)
        - name: GIT_URL
          value: $(params.GIT_URL)
        - name: GIT_HOST
          value: $(params.GIT_HOST)
        - name: SCM_PROVIDER
          value: $(params.SCM_PROVIDER)
        - name: BASE_BRANCH
          value: $(params.BASE_BRANCH)
        - name: RESULT_CHANGED
          value: $(results.CHANGED.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "=== ai-remediate-dependency: calling lw-agents ==="
        echo "CVE: ${CVE_ID}, Package: ${PACKAGE} -> ${FIXED_VERSION}"
        echo "Repo: ${GIT_URL}"

        printf '0' > "${RESULT_CHANGED}"

        # Create session
        SESSION_ID=$(curl -sk -X POST "${AGENT_ENDPOINT}/apps/app/users/tekton/sessions" \
          -H "Content-Type: application/json" -d '{}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])") || {
            echo "ERROR: session creation failed" >&2; exit 1; }

        # Build prompt with CVE details + repo URL for cloning
        python3 << BUILDPROMPT > /tmp/request.json
        import json, os
        prompt = (
            f"Remediate {os.environ['CVE_ID']} in package {os.environ['PACKAGE']}. "
            f"Current version: {os.environ['CURRENT_VERSION']}. "
            f"Fixed version: {os.environ['FIXED_VERSION']}. "
            f"Justification: {os.environ['JUSTIFICATION']}. "
            f"Repository URL: {os.environ['GIT_URL']}. "
            f"Git host: {os.environ['GIT_HOST']}. "
            f"SCM provider: {os.environ['SCM_PROVIDER']}. "
            f"Base branch: {os.environ['BASE_BRANCH']}."
        )
        req = {"app_name":"app","user_id":"tekton","session_id":os.environ.get("SID",""),
               "new_message":{"role":"user","parts":[{"text": prompt}]}}
        # Inject session_id from bash
        import sys
        raw = json.dumps(req)
        raw = raw.replace(os.environ.get("SID",""), "${SESSION_ID}")
        print(raw)
        BUILDPROMPT

        # Fix session_id in the request
        sed -i "s|\${SESSION_ID}|${SESSION_ID}|g" /tmp/request.json 2>/dev/null || \
          python3 -c "
        import json
        d=json.load(open('/tmp/request.json'))
        d['session_id']='${SESSION_ID}'
        json.dump(d,open('/tmp/request.json','w'))
        "

        # Call agent
        curl -sk -X POST "${AGENT_ENDPOINT}/run_sse" \
          -H "Content-Type: application/json" \
          -d @/tmp/request.json \
          --max-time 600 > /tmp/sse_response.txt || {
            echo "ERROR: agent call failed" >&2; exit 1; }

        # Parse structured_result
        python3 << 'PARSE'
        import json, os
        raw = open("/tmp/sse_response.txt").read()
        result = {}
        for line in raw.splitlines():
            if not line.startswith("data:"): continue
            try:
                d = json.loads(line[5:].strip())
                sr = d.get("actions",{}).get("stateDelta",{}).get("structured_result")
                if not sr:
                    sr = (d.get("stateDelta") or {}).get("structured_result")
                if sr and isinstance(sr, dict):
                    result = sr
            except: pass
        changed = result.get("CHANGED", "0")
        if str(changed).lower() in ("1", "true"):
            changed = "1"
        else:
            changed = "0"
        open(os.environ["RESULT_CHANGED"], "w").write(changed)
        print(json.dumps(result, indent=2))
        PARSE

        echo "=== ai-remediate-dependency complete ==="
