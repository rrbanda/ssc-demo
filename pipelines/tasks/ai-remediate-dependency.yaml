apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-remediate-dependency
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "ai, security, remediation, maven"
spec:
  description: >-
    Use the AI agent to update the selected vulnerable Maven dependency to
    its fixed version and confirm the project still compiles. Calls the
    lw-agents ADK service via its external Route over SSE streaming.
  params:
    - name: SUBDIRECTORY
      type: string
      default: source
    - name: CVE_ID
      type: string
    - name: PACKAGE
      type: string
      description: Maven coordinates (groupId:artifactId) to update.
    - name: CURRENT_VERSION
      type: string
      default: ""
    - name: FIXED_VERSION
      type: string
    - name: JUSTIFICATION
      type: string
      default: ""
    - name: AGENT_IMAGE
      type: string
      description: Kept for backward compatibility; unused by the agent service.
      default: unused
    - name: AGENT_ENDPOINT
      type: string
      description: External URL of the lw-agents ADK service.
      default: https://lw-agents-tssc-agents.apps.ocp.qn6c5.sandbox1388.opentlc.com
  workspaces:
    - name: source
  results:
    - name: CHANGED
      description: "1 if the agent modified the build files, else 0."
  steps:
    - name: call-agent
      image: registry.access.redhat.com/ubi9/ubi:latest
      env:
        - name: AGENT_ENDPOINT
          value: $(params.AGENT_ENDPOINT)
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)/$(params.SUBDIRECTORY)
        - name: CVE_ID
          value: $(params.CVE_ID)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: CURRENT_VERSION
          value: $(params.CURRENT_VERSION)
        - name: FIXED_VERSION
          value: $(params.FIXED_VERSION)
        - name: JUSTIFICATION
          value: $(params.JUSTIFICATION)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "Calling lw-agents remediation: ${AGENT_ENDPOINT}"
        echo "CVE: ${CVE_ID}, Package: ${PACKAGE} -> ${FIXED_VERSION}"

        # Fail-safe default
        printf '0' > "$(results.CHANGED.path)"

        # 1. Create session
        SESSION_ID=$(curl -sf -X POST "${AGENT_ENDPOINT}/apps/app/users/tekton/sessions" \
          -H "Content-Type: application/json" -d '{}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])") || {
            echo "ERROR: Failed to create session" >&2; exit 1
          }

        # 2. Build prompt
        PROMPT="Remediate CVE-${CVE_ID} in ${PACKAGE}.
        Current version: ${CURRENT_VERSION}
        Fixed version: ${FIXED_VERSION}
        Justification: ${JUSTIFICATION}
        Workspace path: ${WORKSPACE_PATH}"

        PROMPT_JSON=$(printf '%s' "${PROMPT}" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')

        # 3. Call agent via SSE
        curl -sf -X POST "${AGENT_ENDPOINT}/run_sse" \
          -H "Content-Type: application/json" \
          -d "{\"app_name\":\"app\",\"user_id\":\"tekton\",\"session_id\":\"${SESSION_ID}\",\"new_message\":{\"role\":\"user\",\"parts\":[{\"text\":${PROMPT_JSON}}]}}" \
          --max-time 600 > /tmp/sse_response.txt || {
            echo "ERROR: Agent call failed" >&2; exit 1
          }

        # 4. Parse structured_result
        python3 -c "
        import json
        raw = open('/tmp/sse_response.txt').read()
        result = {}
        for line in raw.splitlines():
            if line.startswith('data: '):
                try:
                    evt = json.loads(line[6:])
                    sr = (evt.get('stateDelta') or {}).get('structured_result')
                    if sr and isinstance(sr, dict):
                        result = sr
                except: pass
        changed = result.get('CHANGED', '0')
        if changed in ('1', 'true', 'True', True):
            changed = '1'
        else:
            changed = '0'
        open('$(results.CHANGED.path)', 'w').write(changed)
        print(json.dumps(result, indent=2))
        "
        echo "Remediation complete."
