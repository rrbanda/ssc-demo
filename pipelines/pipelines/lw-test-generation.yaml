apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    pipelines.openshift.io/runtime: generic
    pipelines.openshift.io/strategy: docker
    pipelines.openshift.io/used-by: build-cloud
    app.kubernetes.io/part-of: lw-agents
  name: lw-test-generation
spec:
  description: >-
    Test generation via lw-agents ADK service. Mirrors agentic-test-generation:
    clone → verify → package → lw-generate-tests. The lw-agents service handles
    CVE investigation, test writing (tee mode), compilation verification (with
    retry), and branch pushing internally.
  params:
    - name: git-url
      type: string
    - name: revision
      type: string
      default: ""
    - name: subdirectory
      type: string
      default: source
    - name: verify-commit
      type: string
      default: "false"
    - name: certificate-identity
      type: string
      default: userX@demo.redhat.com
    - name: oidc-issuer
      type: string
      default: https://sso.<domain>/realms/trusted-artifact-signer
    - name: rekor-url
      type: string
      default: http://rekor-server.tssc-tas.svc
    - name: tuf-mirror
      type: string
      default: http://tuf.tssc-tas.svc
    - name: git-host
      type: string
      default: ""
    - name: scm-provider
      type: string
      default: gitlab
    - name: base-branch
      type: string
      default: master
    - name: CVE_ID
      type: string
      default: ""
    - name: PACKAGE
      type: string
      default: ""
    - name: CURRENT_VERSION
      type: string
      default: ""
    - name: FIXED_VERSION
      type: string
      default: ""
    - name: agent-endpoint
      type: string
      description: lw-agents ADK service route URL
      default: https://lw-agents-tssc-agents.apps.<cluster-domain>
  results:
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    - name: TESTS_ADDED
      value: $(tasks.lw-generate-tests.results.TESTS_ADDED)
  tasks:
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: workspace
        - name: basic-auth
          workspace: git-auth
    - name: verify-commit
      params:
        - name: certificate-identity
          value: $(params.certificate-identity)
        - name: oidc-issuer
          value: $(params.oidc-issuer)
        - name: rekor-url
          value: $(params.rekor-url)
        - name: tuf-mirror
          value: $(params.tuf-mirror)
      runAfter:
        - clone-repository
      taskRef:
        name: verify-commit
      workspaces:
        - name: repository
          workspace: workspace
      when:
        - input: "$(params.verify-commit)"
          operator: in
          values: ["true"]
    - name: package
      params:
        - name: SUBDIRECTORY
          value: $(params.subdirectory)
      runAfter:
        - verify-commit
      taskRef:
        name: maven
      workspaces:
        - name: source
          workspace: workspace
        - name: maven_settings
          workspace: maven-settings
    - name: lw-generate-tests
      runAfter:
        - package
      taskRef:
        name: lw-generate-tests
      params:
        - name: CVE_ID
          value: $(params.CVE_ID)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: CURRENT_VERSION
          value: $(params.CURRENT_VERSION)
        - name: FIXED_VERSION
          value: $(params.FIXED_VERSION)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_HOST
          value: $(params.git-host)
        - name: SCM_PROVIDER
          value: $(params.scm-provider)
        - name: BASE_BRANCH
          value: $(params.base-branch)
        - name: AGENT_ENDPOINT
          value: $(params.agent-endpoint)
      workspaces:
        - name: source
          workspace: workspace
  workspaces:
    - name: workspace
    - name: maven-settings
    - name: git-auth
      optional: true
